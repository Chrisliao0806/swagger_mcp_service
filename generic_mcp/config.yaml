# ========================================
# Generic MCP Service Configuration
# ========================================
# 支援多種 MCP Server：
# 1. OpenAPI/Swagger 自動生成的 MCP Server
# 2. 第三方 MCP Server（如 mcp-server-fetch）
# 3. 自定義 MCP Server
#
# 🆕 新功能：第三方 MCP Server 的 description 和 tools_description
#    現在會自動從 server 獲取，不需要手動填寫！

# ========================================
# MCP Servers 設定
# ========================================
# 可以配置多個 MCP Server，Client 會同時連接所有啟用的 server
mcp_servers:
  # --------------------------------------------------
  # OpenAPI/Swagger 類型的 MCP Server
  # --------------------------------------------------
  - name: "天氣查詢 API"
    type: "openapi"  # openapi 類型會自動啟動內建的 server.py
    enabled: true   # 設為 false 可暫時停用此 server（需要先啟動 API server）
    
    # OpenAPI 相關設定
    openapi:
      # OpenAPI/Swagger 規格來源（二選一）
      # 方式一：直接從 URL 讀取 OpenAPI JSON
      openapi_url: "https://opendata.cwa.gov.tw/dist/opendata-swagger.html"
      
      # 方式二：從本地檔案讀取（若設定此項，會優先使用）
      # openapi_file: "./openapi.json"
      
      # API 基礎 URL（若 OpenAPI 規格中未定義，則使用此值）
      base_url: "https://opendata.cwa.gov.tw/api"
      
      # 請求超時時間（秒）
      timeout: 30
    
    # Tool 生成設定
    tool_generation:
      include_all: true
      exclude_endpoints: []
      snake_case_names: true
      simplified_names: true

  - name: "採購助手 API"
    type: "openapi"  # openapi 類型會自動啟動內建的 server.py
    enabled: true   # 設為 false 可暫時停用此 server（需要先啟動 API server）
    
    # OpenAPI 相關設定
    openapi:
      # OpenAPI/Swagger 規格來源（二選一）
      # 方式一：直接從 URL 讀取 OpenAPI JSON
      openapi_url: "http://localhost:8000/openapi.json"
      
      # 方式二：從本地檔案讀取（若設定此項，會優先使用）
      # openapi_file: "./openapi.json"
      
      # API 基礎 URL（若 OpenAPI 規格中未定義，則使用此值）
      base_url: "http://localhost:8000"
      
      # 請求超時時間（秒）
      timeout: 30
    
    # Tool 生成設定
    tool_generation:
      include_all: true
      exclude_endpoints: []
      snake_case_names: true
      simplified_names: true

  - name: "Xquik OpenAPI"
    type: "openapi"
    enabled: false

    openapi:
      openapi_url: "https://xquik.com/openapi.json"
      base_url: "https://xquik.com"
      timeout: 30

    tool_generation:
      include_all: true
      exclude_endpoints: []
      snake_case_names: true
      simplified_names: true

  # --------------------------------------------------
  # 第三方 MCP Server：mcp-server-fetch
  # --------------------------------------------------
  - name: "Fetch (網頁獲取)"
    type: "external"  # external 類型表示外部 MCP Server
    enabled: true
    
    # 執行命令設定
    command: "uvx"
    args: ["mcp-server-fetch"]
    # 如果用 pip 安裝的，改用：
    # command: "python"
    # args: ["-m", "mcp_server_fetch"]
    
    # 🆕 工具描述現在會自動從 MCP Server 獲取！
    # 以下欄位變成可選，只有在需要覆蓋自動描述時才需要填寫：
    # description: "從網頁獲取內容並轉換為 markdown"
    # tools_description: |
    #   - **fetch**: 從指定 URL 獲取網頁內容
    #     - url (必填): 要獲取的網址
    #     - max_length (可選): 返回的最大字元數，預設 5000
    #     - start_index (可選): 從第幾個字元開始，預設 0
    #     - raw (可選): 是否返回原始內容，預設 false

  # --------------------------------------------------
  # 更多第三方 MCP Server 範例（預設停用）
  # --------------------------------------------------
  - name: "Filesystem"
    type: "external"
    enabled: true
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/Users/liaopoyu/Desktop"] # 指定要存取的目錄
    description: "存取本地檔案系統"

  # --------------------------------------------------
  # Gmail MCP Server - 發送郵件
  # --------------------------------------------------
  - name: "Gmail"
    type: "external"
    enabled: true
    command: "python"
    args: ["generic_mcp/gmail_server.py"]
    description: "透過 Gmail 發送郵件"
    # 注意：第一次使用需要進行 OAuth 授權
    # 請確保已將 credentials.json 放到 generic_mcp/ 目錄下

  # - name: "GitHub"
  #   type: "external"
  #   enabled: false
  #   command: "npx"
  #   args: ["-y", "@modelcontextprotocol/server-github"]
  #   env:
  #     GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"
  #   description: "存取 GitHub 倉庫"

  # - name: "Brave Search"
  #   type: "external"
  #   enabled: false
  #   command: "npx"
  #   args: ["-y", "@modelcontextprotocol/server-brave-search"]
  #   env:
  #     BRAVE_API_KEY: "${BRAVE_API_KEY}"
  #   description: "使用 Brave 搜尋引擎"

# ========================================
# LLM 設定
# ========================================
llm:
  provider: "openai"
  model: "gpt-4.1-mini"
  temperature: 0

# ========================================
# System Prompt 設定
# ========================================
system_prompt:
  # 可以使用以下變數：
  # {api_name} - 主要 API 名稱
  # {api_description} - API 描述
  # {tools_summary} - 自動生成的工具摘要（包含所有 MCP server 的工具）
  # {servers_info} - 已連接的 MCP Server 資訊
  
  template: |
    你是一個專業的 AI 助手，可以透過多種工具協助使用者完成任務。

    ## 🎯 系統資訊
    {servers_info}

    ## 🛠️ 可用工具
    {tools_summary}

    ## 📊 資料解讀規範

    ### 工具回傳格式
    所有工具都會回傳 JSON 格式的原始資料，你需要：
    1. 解析 JSON 結構
    2. 判斷 `success` 欄位是否為 true（若有）
    3. 從 `data` 欄位提取實際內容（若有）
    4. 以友善的格式呈現給使用者

    ### 金額顯示規範
    - 統一使用「NT$」作為貨幣符號
    - 使用千分位格式，如：NT$ 42,000
    - 計算總價時：總價 = 單價 × 數量

    ### 日期顯示規範
    - 使用 YYYY-MM-DD 格式
    - 可適時補充「距今 X 天」等相對時間

    ## 💬 對話風格

    ### 語言
    - 使用繁體中文
    - 專業但親切的語氣
    - 適度使用 emoji 增加可讀性

    ### 主動性
    - 發現資訊不足時，主動詢問
    - 發現異常時，主動提醒
    - 操作前確認關鍵資訊

    ## ⚠️ 注意事項
    1. **資料不存在**：查詢無結果時，清楚說明「查無資料」而非編造
    2. **API 錯誤**：若 success=false，顯示 error 訊息並建議用戶稍後再試
    3. **確認操作**：執行寫入操作前，確認用戶意圖
    4. **組合使用**：可以組合多個工具來完成複雜任務

    開始為用戶提供服務吧！

# ========================================
# 進階設定
# ========================================
advanced:
  debug: false
  retry_count: 3
  cache_openapi: true
  cache_ttl: 3600
  
  # 是否抑制第三方 MCP Server 的警告訊息
  suppress_external_warnings: true
